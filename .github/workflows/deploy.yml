name: "Continuous Deployment to AWS EC2"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: "Deploy to Production EC2"
    runs-on: ubuntu-latest
    if: github.repository == 'AsadNadeem2003/AI-LectureHub'

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Deploy via SSH to AWS EC2"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30m
          command_timeout: 30m
          script: |
            set -e
            echo "🚀 Connecting to EC2 and deploying latest build..."
            cd ~/AI-LectureHub || (git clone https://github.com/AsadNadeem2003/AI-LectureHub.git ~/AI-LectureHub && cd ~/AI-LectureHub)
            git pull origin main
            sudo docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            echo "✅ Deployment completed successfully!"
